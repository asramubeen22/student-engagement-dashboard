{% extends "base.html" %}

{% block page_title %}Student Management{% endblock %}

{% block content %}
<div class="students-management">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Students at Risk</h2>
            <div class="filters">
                <select class="filter-select" style="padding: 0.5rem; border: 1px solid #e9ecef; border-radius: 8px; margin-right: 1rem;">
                    <option>All Programs</option>
                    <option>Computer Science</option>
                    <option>Engineering</option>
                    <option>Business</option>
                </select>
                <select class="filter-select" style="padding: 0.5rem; border: 1px solid #e9ecef; border-radius: 8px;">
                    <option>All Risk Levels</option>
                    <option>High Risk</option>
                    <option>Medium Risk</option>
                    <option>Low Risk</option>
                </select>
            </div>
        </div>
        
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Program</th>
                        <th>Attendance</th>
                        <th>GPA</th>
                        <th>Risk Score</th>
                        <th>Last Activity</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="students-tbody">
                    <!-- Data will be populated by JavaScript -->
                </tbody>
            </table>
        </div>
        
        <div class="table-footer" style="padding: 1rem; display: flex; justify-content: space-between; align-items: center;">
            <div class="pagination">
                <button class="btn btn-outline" style="margin-right: 0.5rem;">Previous</button>
                <span style="margin: 0 1rem;">Page 1 of 5</span>
                <button class="btn btn-outline" style="margin-left: 0.5rem;">Next</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Load students data
fetch('/api/students')
    .then(response => response.json())
    .then(students => {
        const tbody = document.getElementById('students-tbody');
        tbody.innerHTML = students.map(student => `
            <tr>
                <td>${student.id}</td>
                <td>
                    <div style="display: flex; flex-direction: column;">
                        <strong>${student.name}</strong>
                        <small style="color: #6c757d; font-size: 0.75rem;">${student.email}</small>
                    </div>
                </td>
                <td>${student.program}</td>
                <td>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${student.attendance}%"></div>
                        <span style="margin-left: 0.5rem; font-size: 0.875rem;">${student.attendance}%</span>
                    </div>
                </td>
                <td>${student.gpa}</td>
                <td>
                    <span class="risk-badge risk-${student.risk_level.toLowerCase()}">
                        ${student.risk_score}% - ${student.risk_level}
                    </span>
                </td>
                <td>${student.last_activity}</td>
                <td>
                    <a href="/student/${student.id}" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
                        <i class="fas fa-eye"></i>
                        View
                    </a>
                </td>
            </tr>
        `).join('');
    });
</script>
{% endblock %}
